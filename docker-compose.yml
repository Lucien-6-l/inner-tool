services:
  postgres:
    image: postgres:17-alpine
    container_name: inner-tool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inner_tool
      POSTGRES_PASSWORD: inner_tool_dev
      POSTGRES_DB: inner_tool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inner_tool -d inner_tool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inner-tool-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
